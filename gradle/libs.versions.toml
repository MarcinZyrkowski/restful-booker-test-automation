[versions]
java = "21"
springBoot = "3.5.5"
springDependencyManagement = "1.1.7"
lombokPlugin = "9.0.0"
allurePlugin = "3.0.0"
spotlessPlugin = "6.22.0"

lombok = "1.18.40"
restAssured = "5.5.6"
datafaker = "2.5.4"
jackson = "2.20.0"
aspectj = "1.9.22.1"
allure = "2.26.0"
googleJavaFormat = "1.30.0"
junit = "5.10.0"

[libraries]
# Plugins (for reference or manual application)
spring-boot-gradle-plugin = { group = "org.springframework.boot", name = "spring-boot-gradle-plugin", version.ref = "springBoot" }

# Testing
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

# Spring
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }

# Utilities
datafaker = { group = "net.datafaker", name = "datafaker", version.ref = "datafaker" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
aspectj-weaver = { group = "org.aspectj", name = "aspectjweaver", version.ref = "aspectj" }

# API Testing
rest-assured = { group = "io.rest-assured", name = "rest-assured", version.ref = "restAssured" }
allure-junit5 = { group = "io.qameta.allure", name = "allure-junit5", version.ref = "allure" }
allure-rest-assured = { group = "io.qameta.allure", name = "allure-rest-assured", version.ref = "allure" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
lombok = { id = "io.freefair.lombok", version.ref = "lombokPlugin" }
allure = { id = "io.qameta.allure", version.ref = "allurePlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotlessPlugin" }