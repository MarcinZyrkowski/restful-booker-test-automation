# Default values are the public demo credentials for Restful Booker.
#
# Recommended usage:
# - locally: rely on defaults or override via env vars
# - CI: select a Spring profile (qa/dev) and/or inject env vars
#
# Override via environment variables:
# - BOOKER_BASE_URL
# - BOOKER_USERNAME
# - BOOKER_PASSWORD
booker.base-url=${BOOKER_BASE_URL:https://restful-booker.herokuapp.com}
booker.auth.username=${BOOKER_USERNAME:admin}
booker.auth.password=${BOOKER_PASSWORD:password123}
