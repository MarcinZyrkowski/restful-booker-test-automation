# Default values are the public demo credentials for Restful Booker.
# Override via environment variables to keep configuration out of the repo:
# - BOOKER_BASE_URL
# - BOOKER_USERNAME
# - BOOKER_PASSWORD
base_url=${BOOKER_BASE_URL:https://restful-booker.herokuapp.com}
app.username=${BOOKER_USERNAME:admin}
app.password=${BOOKER_PASSWORD:password123}
